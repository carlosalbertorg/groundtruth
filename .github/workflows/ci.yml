name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      # Pinned to a release rather than `master`: this step runs with
      # security-events: write, so it shouldn't track an unreviewed branch.
      # Dependabot (github-actions) proposes bumps.
      - uses: securego/gosec@v2.29.0
        with:
          args: "-exclude-generated -no-fail -fmt sarif -out gosec-results.sarif ./..."
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The embed package needs at least a placeholder dist/index.html,
      # which is committed for exactly this reason - see
      # internal/webassets/embed.go.
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

  test-go-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # Exercises the real terraform binary end to end (init -> plan
      # -refresh-only -> show -> drift.FromPlan) against a fixture module
      # using the local/null providers only - no cloud credentials.
      - run: go test -tags=integration ./internal/terraform/... -v

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: npm run build

  # Builds the release image the way `docker build .` (and GoReleaser) does, so a
  # Dockerfile change that would break a release - a signature check, a pinned
  # digest, a moved download - fails here instead of at tag time.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t groundtruth:ci .
      - name: The bundled binaries run
        run: |
          docker run --rm --entrypoint terraform groundtruth:ci version
          docker run --rm --entrypoint tofu groundtruth:ci version
      - name: The server starts and answers its health check
        run: |
          docker run -d --name groundtruth -p 127.0.0.1:8080:8080 groundtruth:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs groundtruth
          exit 1
