name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: groundtruth version
      placeholder: e.g. v0.3.0, or a commit SHA if running from source
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running groundtruth?
      options:
        - Docker / docker-compose
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact anything sensitive (credential paths, internal hostnames) before pasting.
      render: shell
