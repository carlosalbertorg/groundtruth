version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Dockerfile's base images (node, golang, alpine) ship in the release
  # image, so their security patches matter as much as the Go dependencies'.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
